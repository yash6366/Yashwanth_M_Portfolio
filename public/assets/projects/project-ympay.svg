  <text x="248" y="393" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Direct Deposit Wire</text>
  <text x="248" y="406" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">TxID: 0x7c9b...11a0 • Verified Gateway</text>
  <text x="690" y="397" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">+$3,200.00</text>

