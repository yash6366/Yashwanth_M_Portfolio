  <!-- Main Content Area -->
  <!-- Wallet Hero Card -->
  <rect x="198" y="78" width="360" height="150" rx="12" fill="linear-gradient(135deg, #1e293b 0%, #0f172a 100%)" stroke="rgba(56,189,248,0.2)"/>
