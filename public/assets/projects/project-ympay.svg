  <text x="248" y="361" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">TxID: 0x3d2c...88f1 • Scheduled Payment</text>
  <text x="715" y="352" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">-$64.00</text>

