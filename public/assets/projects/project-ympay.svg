  </defs>

  <!-- Browser Frame Window -->
  <rect x="20" y="20" width="760" height="460" rx="12" fill="url(#ym-bg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="url(#ym-shadow)"/>
  
  <!-- Browser Window Header -->
