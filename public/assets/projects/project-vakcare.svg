<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vk-bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070d14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="vk-shadow" x="-10" y="-10" width="820" height="520" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Browser Frame Window -->
  <rect x="20" y="20" width="760" height="460" rx="12" fill="url(#vk-bg)" stroke="rgba(56,189,248,0.2)" stroke-width="1.5" filter="url(#vk-shadow)"/>
  
  <!-- Browser Window Header -->
  <path d="M 20 32 Q 20 20 32 20 L 768 20 Q 780 20 780 32 L 780 60 L 20 60 Z" fill="#0f172a"/>
  <line x1="20" y1="60" x2="780" y2="60" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="45" cy="40" r="5" fill="#ef4444"/>
  <circle cx="62" cy="40" r="5" fill="#eab308"/>
  <circle cx="79" cy="40" r="5" fill="#22c55e"/>
  
  <!-- URL Bar -->
  <rect x="110" y="30" width="380" height="20" rx="5" fill="#020617" stroke="rgba(255,255,255,0.08)"/>
  <text x="125" y="44" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">https://vak-care-chi.vercel.app/consultation</text>
  
  <!-- Left Nav -->
  <rect x="20" y="60" width="160" height="420" fill="#0b1329" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="45" cy="88" r="9" fill="#38bdf8"/>
  <text x="62" y="93" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">Vak<tspan fill="#38bdf8">Care</tspan></text>
  
  <rect x="32" y="115" width="136" height="28" rx="6" fill="rgba(56,189,248,0.15)" stroke="rgba(56,189,248,0.3)"/>
  <text x="46" y="133" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">AI Clinical Triage</text>
  
  <text x="46" y="170" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Patient Vitals</text>
  <text x="46" y="202" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Doctor Advisory</text>
  <text x="46" y="234" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Prescriptions</text>
  <text x="46" y="266" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">EHR Storage</text>

  <!-- Main Patient Intake Screen -->
  <!-- Patient Header Banner -->
  <rect x="198" y="78" width="568" height="65" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="230" cy="110" r="18" fill="rgba(56,189,248,0.2)"/>
  <text x="224" y="115" fill="#38bdf8" font-size="16">✚</text>
  <text x="260" y="105" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">AI Health Triage &amp; Symptom Intake</text>
  <text x="260" y="123" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Session #VK-902 • AI Assisted • Shristi Hackathon Winner</text>
  <rect x="650" y="96" width="98" height="28" rx="6" fill="#0284c7"/>
  <text x="664" y="114" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800">EMERGENCY</text>

  <!-- Interactive AI Diagnosis Chat & Vitals -->
  <!-- Left Chat Box -->
  <rect x="198" y="155" width="360" height="308" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.08)"/>
  <text x="218" y="180" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">CONVERSATIONAL TRIAGE</text>
  
  <!-- AI Message -->
  <rect x="214" y="195" width="310" height="60" rx="8" fill="#1e293b"/>
  <text x="226" y="215" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">VakCare AI Assistant</text>
  <text x="226" y="235" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Please describe your symptoms and when they began.</text>
  
  <!-- User Message -->
  <rect x="240" y="265" width="300" height="50" rx="8" fill="#0369a1"/>
  <text x="252" y="285" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Mild fever and persistent cough for 2 days.</text>
  
  <!-- AI Diagnosis Card -->
  <rect x="214" y="325" width="328" height="120" rx="8" fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.3)"/>
  <text x="228" y="348" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">PRELIMINARY ASSESSMENT</text>
  <text x="228" y="370" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Upper Respiratory Tract Infection (Likelihood: 88%)</text>
  <text x="228" y="390" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Recommended Action: Tele-consult General Physician</text>
  <text x="228" y="420" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">✓ Vitals within safe threshold (SpO2: 98%, Pulse: 76)</text>

  <!-- Right Vitals Panel -->
  <rect x="570" y="155" width="196" height="308" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.08)"/>
  <text x="586" y="180" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">PATIENT METRICS</text>

  <rect x="586" y="195" width="164" height="60" rx="8" fill="#1e293b"/>
  <text x="598" y="215" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">HEART RATE</text>
  <text x="598" y="240" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900">76 <tspan font-size="10" font-weight="500" fill="#94a3b8">BPM</tspan></text>

  <rect x="586" y="265" width="164" height="60" rx="8" fill="#1e293b"/>
  <text x="598" y="285" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">OXYGEN (SPO2)</text>
  <text x="598" y="310" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900">98%</text>

  <rect x="586" y="335" width="164" height="60" rx="8" fill="#1e293b"/>
  <text x="598" y="355" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">TEMPERATURE</text>
  <text x="598" y="380" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900">99.1°F</text>

  <rect x="586" y="410" width="164" height="38" rx="6" fill="#38bdf8"/>
  <text x="608" y="433" fill="#000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900">CONNECT DOCTOR</text>
</svg>
